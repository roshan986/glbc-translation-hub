<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="112" fill="#1e293b"/>
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Circular accent backdrop -->
  <circle cx="256" cy="256" r="180" fill="#0f172a" stroke="#334155" stroke-width="4"/>
  
  <!-- Open Bible Graphic -->
  <g filter="url(#shadow)" transform="translate(96, 120)">
    <!-- Left Page -->
    <path d="M 160 210 C 100 200, 30 205, 0 220 L 0 50 C 30 35, 100 30, 160 45 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="4"/>
    <!-- Right Page -->
    <path d="M 160 210 C 220 200, 290 205, 320 220 L 320 50 C 290 35, 220 30, 160 45 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="4"/>
    <!-- Center Spine & Ribbon -->
    <line x1="160" y1="40" x2="160" y2="220" stroke="#0284c7" stroke-width="6"/>
    <!-- Gold Ribbon Bookmark -->
    <path d="M 160 42 L 160 250 L 175 235 L 190 250 L 190 44 Z" fill="url(#goldGrad)" opacity="0.95"/>
    <!-- Left text lines simulation -->
    <line x1="30" y1="75" x2="130" y2="72" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
    <line x1="30" y1="100" x2="130" y2="97" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
    <line x1="30" y1="125" x2="130" y2="122" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
    <line x1="30" y1="150" x2="110" y2="147" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
    <!-- Right text lines simulation -->
    <line x1="190" y1="72" x2="290" y2="75" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
    <line x1="190" y1="97" x2="290" y2="100" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
    <line x1="190" y1="122" x2="290" y2="125" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
    <line x1="190" y1="147" x2="270" y2="150" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- GLBC Badge at bottom -->
  <rect x="156" y="380" width="200" height="42" rx="21" fill="url(#emeraldGrad)"/>
  <text x="256" y="408" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="3">GLBC HUB</text>
</svg>
